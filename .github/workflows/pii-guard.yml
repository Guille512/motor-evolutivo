name: pii-guard
# Bloquea PRs/pushes con datos personales (telefonos AR, DNI, registros paciente+telefono)
# ademas de secretos. Cubre los commits que no pasan por los hooks locales (sesiones en la nube).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secretos + PII)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || RANGE="${{ github.sha }}~1..${{ github.sha }}"
          fi
          ./gitleaks git . --config .github/gitleaks-pii.toml --redact --no-banner --log-opts="$RANGE"
